name: Publish Pages

# Publishing is deliberate. Pushing code never republishes a hidden site.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    # This workflow is for the public GitHub Free deployment, on the default branch.
    if: ${{ !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
      - name: Read Pages address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        run: npm ci
      - name: Test and build the public map
        run: npm run check:github
        env:
          GITHUB_PAGES_BASE: ${{ steps.pages.outputs.base_path }}/
          # Optional browser keys: their values become public in the built app.
          VITE_OS_API_KEY: ${{ secrets.PAGES_OS_API_KEY }}
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.PAGES_GOOGLE_MAPS_BROWSER_KEY }}
      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist-github
          retention-days: 1
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
